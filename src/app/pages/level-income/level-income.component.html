<app-page-header eyebrow="Income Management" title="Level Income" description="Review all farmer earnings generated through this income channel."/><div class="summary"><div><span>Total Recorded</span><b>₹10,050</b></div><div><span>Credited Records</span><b>{{d.level.length}}</b></div><div><span>Pending Review</span><b>1</b></div></div><section class="panel"><div class="head"><div><span>Income Ledger</span><h3>Level Income List</h3></div><button>Export CSV</button></div><div class="table"><table><thead><tr><th>Date</th><th>Farmer</th><th>Source</th><th>Level / Position</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr *ngFor="let x of pagedLevel"><td>{{x.date}}</td><td>{{x.farmer}}</td><td>{{x.source}}</td><td>{{x.level}}</td><td class="amount">₹{{x.amount | number}}</td><td><em [class.pending]="x.status==='Pending'">{{x.status}}</em></td></tr></tbody></table></div><app-pagination [page]="page" [pageSize]="pageSize" [total]="d.level.length" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination></section>
