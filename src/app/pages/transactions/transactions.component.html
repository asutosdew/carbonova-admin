<app-page-header eyebrow="Finance" title="Transactions" description="System-wide transaction history across payments, income and payouts."/><section class="panel"><div class="head"><div><span>System Ledger</span><h3>All Transactions</h3></div></div><div class="table"><table><thead><tr><th>Date</th><th>Type</th><th>Reference</th><th>Farmer</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr *ngFor="let r of pagedRows"><td>{{r[0]}}</td><td>{{r[1]}}</td><td>{{r[2]}}</td><td>{{r[3]}}</td><td class="amount">{{r[4]}}</td><td><em>{{r[5]}}</em></td></tr></tbody></table></div><app-pagination [page]="page" [pageSize]="pageSize" [total]="rows.length" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination></section>
