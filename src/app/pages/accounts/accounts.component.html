<app-page-header eyebrow="Finance" title="Farmer Accounts" description="Open a consolidated account view for balances, team activity and payout readiness."/><section class="panel"><div class="head"><div><span>Accounts Directory</span><h3>All Farmer Accounts</h3></div><input placeholder="Search account..."></div><div class="table"><table><thead><tr><th>Farmer</th><th>Balance</th><th>Direct</th><th>Team</th><th>Package</th><th>Account Status</th><th>Action</th></tr></thead><tbody><tr *ngFor="let f of pagedFarmers"><td><b>{{f.name}}</b><small>{{f.id}}</small></td><td class="amount">₹{{f.balance | number}}</td><td>{{f.direct}}</td><td>{{f.team}}</td><td>{{f.package}}</td><td><em [class.pending]="f.status==='Pending'">{{f.status}}</em></td><td><button>Open Account</button></td></tr></tbody></table></div><app-pagination [page]="page" [pageSize]="pageSize" [total]="d.farmers.length" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination></section>
