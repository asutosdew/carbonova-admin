<app-page-header eyebrow="Product Management" title="Packages" description="Create and manage farmer participation packages and their configured benefits."/><div class="package-grid"><article *ngFor="let p of d.packages"><div class="top"><span>{{p.status}}</span><button (click)="toggle(p)">•••</button></div><h3>{{p.name}}</h3><strong>₹{{p.price | number}}</strong><div class="credit">{{p.credits}} tCO₂e project allocation</div><div class="rules"><div><b>{{p.direct}}%</b><small>Direct</small></div><div><b>{{p.level}}%</b><small>Level</small></div><div><b>{{p.matrix}}%</b><small>Matrix</small></div></div><button class="edit" (click)="openEdit(p)">Edit Package</button></article><article class="new"><span>+</span><h3>Create New Package</h3><p>Configure price, carbon allocation and income rules.</p><button>Create Package</button></article></div>
<app-edit-modal *ngIf="showEdit" title="Edit Package" [model]="editing" [fields]="[{key:'name',label:'Package Name'},{key:'price',label:'Price',type:'number'},{key:'credits',label:'Carbon Allocation',type:'number'},{key:'direct',label:'Direct %',type:'number'},{key:'level',label:'Level %',type:'number'},{key:'matrix',label:'Matrix %',type:'number'}]" (saved)="saveEdit($event)" (closed)="closeEdit()"></app-edit-modal>
