<app-page-header eyebrow="Finance" title="Payout Summary" description="View every farmer's balance, eligible payout and pending amount in one place."/><div class="summary"><div><span>Total Farmer Balance</span><b>₹61,250</b></div><div><span>Eligible Payout</span><b>₹60,950</b></div><div><span>Pending / Review</span><b>₹2,600</b></div></div><section class="panel"><div class="head"><div><span>Farmer Payouts</span><h3>Payout Summary</h3></div><button>Export Summary</button></div><div class="table"><table><thead><tr><th>Farmer</th><th>Total Balance</th><th>Eligible</th><th>Pending</th><th>Status</th><th>Action</th></tr></thead><tbody><tr *ngFor="let x of pagedPayouts"><td><b>{{x.name}}</b><small>{{x.farmer}}</small></td><td>₹{{x.balance | number}}</td><td class="amount">₹{{x.eligible | number}}</td><td>₹{{x.pending | number}}</td><td><em [class.review]="x.status==='Review'">{{x.status}}</em></td><td><button class="review">View Account</button></td></tr></tbody></table></div><app-pagination [page]="page" [pageSize]="pageSize" [total]="d.payouts.length" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)"></app-pagination></section>
