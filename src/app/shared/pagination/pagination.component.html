<div class="pagination" *ngIf="total > 0">
  <div class="pagination-info">Showing <b>{{ start }}</b>–<b>{{ end }}</b> of <b>{{ total }}</b></div>
  <div class="pagination-controls">
    <label>Rows
      <select [value]="pageSize" (change)="changeSize($event)">
        <option *ngFor="let size of pageSizes" [value]="size">{{ size }}</option>
      </select>
    </label>
    <button type="button" [disabled]="page===1" (click)="go(page-1)">‹</button>
    <ng-container *ngFor="let p of pages; let i=index">
      <span class="dots" *ngIf="i>0 && p-pages[i-1]>1">…</span>
      <button type="button" [class.active]="p===page" (click)="go(p)">{{ p }}</button>
    </ng-container>
    <button type="button" [disabled]="page===totalPages" (click)="go(page+1)">›</button>
  </div>
</div>
